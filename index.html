<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TEJA AI GAMING CREATOR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #070b18 0%, #0d1328 100%);
      color: #ffffff;
    }

    header {
      padding: 22px 18px;
      text-align: center;
      background: rgba(17, 21, 44, 0.95);
      border-bottom: 2px solid #7d5cff;
      box-shadow: 0 4px 18px rgba(125, 92, 255, 0.2);
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
      color: #b799ff;
      letter-spacing: 1px;
    }

    header p {
      margin: 8px 0 0;
      color: #cfcfd9;
      font-size: 1rem;
    }

    #chat {
      height: 66vh;
      overflow-y: auto;
      padding: 18px 16px 110px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 85%;
      padding: 14px 16px;
      margin: 10px 0;
      border-radius: 16px;
      line-height: 1.6;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
      word-wrap: break-word;
    }

    .bot {
      background: #1d2745;
      border-left: 4px solid #8a6ef0;
    }

    .user {
      margin-left: auto;
      background: linear-gradient(135deg, #6d47d6, #8f5cf8);
      border-right: 4px solid #d4c2ff;
    }

    .controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 14px;
      background: rgba(17, 21, 44, 0.96);
      border-top: 1px solid #7d5cff;
      backdrop-filter: blur(8px);
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #5f6280;
      background: #090d1a;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: #8d6dff;
      box-shadow: 0 0 0 2px rgba(141, 109, 255, 0.25);
    }

    button {
      border: none;
      padding: 14px 18px;
      border-radius: 12px;
      background: linear-gradient(135deg, #7a4ef0, #9b66ff);
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.8rem; }
      .msg { max-width: 92%; }
      .controls { gap: 8px; padding: 10px; }
      button { padding: 12px 14px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🎮 TEJA AI GAMING CREATOR</h1>
    <p>Your gaming assistant for tips, strategy, content, and voice help</p>
  </header>

  <div id="chat">
    <div class="msg bot">
      Welcome to TEJA AI GAMING CREATOR! 🔥<br>
      Ask me anything about gaming, setups, content, or strategy.
    </div>
  </div>

  <div class="controls">
    <input id="question" placeholder="Ask your gaming question..." />
    <button onclick="send()">Send</button>
    <button onclick="voice()">🎤</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("question");

    function addMessage(message, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = message;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function gamingAnswer(question) {
      const q = question.toLowerCase();

      if (q.includes("free fire")) {
        return "Free Fire tip: keep moving, use cover smartly, and practice recoil control. Teamwork wins more than random fights.";
      }

      if (q.includes("pubg") || q.includes("battle royale")) {
        return "Battle royale tip: land smart, loot fast, stay in the safe zone, and avoid unnecessary fights early.";
      }

      if (q.includes("sensitivity")) {
        return "Sensitivity depends on your playstyle and device. Start moderate, then adjust in training mode until your aim feels smooth and stable.";
      }

      if (q.includes("youtube")) {
        return "For YouTube gaming content, make strong thumbnails, catchy titles, and post clips that show action, skill, or funny moments.";
      }

      if (q.includes("instagram") || q.includes("reels")) {
        return "For Instagram, post short gameplay reels, engaging hooks, and interactive captions with trending gaming sounds.";
      }

      if (q.includes("setup") || q.includes("pc") || q.includes("mobile")) {
        return "A good gaming setup includes smooth performance, comfortable controls, good audio, and a stable internet connection.";
      }

      if (q.includes("hello") || q.includes("hi") || q.includes("hey")) {
        return "Hello gamer! I’m TEJA AI GAMING CREATOR. What game or gaming topic do you want help with today?";
      }

      if (q.includes("tips")) {
        return "Gaming tips: practice daily, learn map rotations, improve aim, and always review your mistakes after each match.";
      }

      return "Great question! I’m TEJA AI GAMING CREATOR, your AI gaming assistant. Ask about games, strategies, content, or gameplay tips!";
    }

    function send() {
      const q = input.value.trim();
      if (!q) return;

      addMessage(q, "user");
      input.value = "";

      setTimeout(() => {
        addMessage(gamingAnswer(q), "bot");
      }, 400);
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });

    function voice() {
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        addMessage("Voice input is not supported in this browser.", "bot");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        input.value = transcript;
        send();
      };

      recognition.start();
    }
  </script>

</body>
</html>
