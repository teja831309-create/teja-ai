<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b18">
  <title>TEJA AI — Gaming Assistant</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      background: #080b18;
      color: #f7f5ff;
      --panel: #11152c;
      --bot: #202644;
      --purple: #8153ed;
      --muted: #aaa7bb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse at 50% -20%, #28204d 0, transparent 55%), #080b18;
    }
    header {
      flex: 0 0 auto;
      padding: 18px 20px;
      text-align: center;
      background: rgb(17 21 44 / 92%);
      border-bottom: 1px solid #7545ff;
    }
    .header-row {
      max-width: 850px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { text-align: left; }
    h1 { margin: 0; color: #b69aff; font-size: 1.5rem; }
    header p { margin: 5px 0 0; color: var(--muted); font-size: .9rem; }
    .clear-button {
      padding: 9px 12px;
      border: 1px solid #393454;
      border-radius: 9px;
      background: transparent;
      color: #ddd6f4;
      cursor: pointer;
    }
    .clear-button:hover { background: #24203b; }
    main {
      width: min(100%, 850px);
      flex: 1;
      min-height: 0;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }
    #chat { flex: 1; overflow-y: auto; padding: 20px 16px 14px; scroll-behavior: smooth; }
    .msg {
      width: fit-content;
      max-width: min(85%, 620px);
      margin: 10px 0;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .bot { background: var(--bot); border: 1px solid #303858; border-bottom-left-radius: 5px; }
    .user { margin-left: auto; background: #633dce; border-bottom-right-radius: 5px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 14px; }
    .suggestion {
      padding: 8px 11px;
      border: 1px solid #3a315d;
      border-radius: 999px;
      background: #15132a;
      color: #d9ceff;
      cursor: pointer;
    }
    .suggestion:hover { border-color: var(--purple); background: #211a3d; }
    .composer { flex: 0 0 auto; padding: 12px 16px max(12px, env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid #292d49; }
    .composer-inner { max-width: 818px; margin: 0 auto; display: flex; gap: 9px; }
    input {
      min-width: 0;
      flex: 1;
      padding: 13px 15px;
      border: 1px solid #41445b;
      border-radius: 12px;
      outline: none;
      background: #080b18;
      color: white;
      font: inherit;
    }
    input:focus { border-color: #9c79ff; }
    button { font: inherit; }
    .send-button, .voice-button {
      min-width: 48px;
      padding: 12px 15px;
      border: 0;
      border-radius: 12px;
      background: var(--purple);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .send-button:hover, .voice-button:hover { background: #966ff5; }
    .voice-button[aria-pressed="true"] { background: #c43f71; }
    .send-button:focus-visible, .voice-button:focus-visible, .clear-button:focus-visible,
    .suggestion:focus-visible, input:focus-visible { outline: 2px solid #c5b3ff; outline-offset: 2px; }
    @media (max-width: 480px) {
      header { padding: 15px; }
      h1 { font-size: 1.25rem; }
      .msg { max-width: 92%; }
      .send-button { padding-inline: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <div class="brand">
        <h1>🎮 TEJA AI</h1>
        <p>Your personal gaming assistant</p>
      </div>
      <button class="clear-button" id="clearChat" type="button">Clear chat</button>
    </div>
  </header>
  <main>
    <div id="chat" role="log" aria-live="polite" aria-label="Chat messages"></div>
    <div class="suggestions" aria-label="Try asking">
      <button class="suggestion" type="button" data-question="Give me a Free Fire tip">🔥 Free Fire tip</button>
      <button class="suggestion" type="button" data-question="How do I improve my sensitivity?">🎯 Sensitivity</button>
      <button class="suggestion" type="button" data-question="How can I grow my gaming YouTube channel?">▶️ Gaming YouTube</button>
    </div>
  </main>
  <form class="composer" id="chatForm">
    <div class="composer-inner">
      <input id="question" type="text" placeholder="Ask your gaming question..." autocomplete="off" aria-label="Your gaming question">
      <button class="voice-button" id="voiceButton" type="button" aria-label="Start voice input" aria-pressed="false">🎤</button>
      <button class="send-button" type="submit">Send</button>
    </div>
  </form>
  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("question");
    const form = document.getElementById("chatForm");
    const voiceButton = document.getElementById("voiceButton");
    const storageKey = "teja-ai-chat-v1";

    function addMessage(message, type, save = true) {
      const div = document.createElement("div");
      div.className = `msg ${type}`;
      div.textContent = message;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      if (save) saveChat();
    }

    function saveChat() {
      const messages = [...chat.querySelectorAll(".msg")].map(message => ({
        text: message.textContent,
        type: message.classList.contains("user") ? "user" : "bot"
      }));
      try { localStorage.setItem(storageKey, JSON.stringify(messages)); } catch { /* Storage is optional. */ }
    }

    function loadChat() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        if (Array.isArray(saved) && saved.length) {
          saved.forEach(message => {
            if (typeof message.text === "string" && ["user", "bot"].includes(message.type)) {
              addMessage(message.text, message.type, false);
            }
          });
          if (chat.childElementCount) return;
        }
      } catch { /* Start a fresh conversation if saved data is invalid. */ }
      addMessage("Welcome to TEJA AI! 🔥\nAsk me anything about gaming, or choose a suggestion below.", "bot", false);
      saveChat();
    }

    function gamingAnswer(question) {
      const q = question.toLowerCase();
      if (q.includes("free fire")) return "Free Fire tip: Practice movement, aim, and teamwork. Try different strategies in training mode and play fair!";
      if (q.includes("sensitivity") || q.includes("aim")) return "Sensitivity depends on your device and comfort. Adjust one setting at a time, then test it in training mode until it feels right.";
      if (q.includes("youtube")) return "For a gaming YouTube channel, post consistently, use clear thumbnails, make engaging titles, and focus on videos your audience enjoys.";
      if (q.includes("instagram") || q.includes("reel")) return "Share original gaming clips, make engaging Reels, add captions, and interact with your audience.";
      if (q.includes("hello") || q.includes("hi")) return "Hello, gamer! Welcome to TEJA AI. What game are we talking about today?";
      if (q.includes("minecraft")) return "Minecraft idea: Set a goal for your next world—build a base, explore a biome, or try a new survival challenge!";
      return "Great question! I'm TEJA AI, your gaming assistant demo. Try asking about Free Fire, sensitivity, or gaming content creation.";
    }

    function sendMessage(message) {
      const question = message.trim();
      if (!question) return;
      addMessage(question, "user");
      input.value = "";
      input.focus();
      window.setTimeout(() => addMessage(gamingAnswer(question), "bot"), 350);
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage(input.value);
    });

    document.querySelectorAll(".suggestion").forEach(button => {
      button.addEventListener("click", () => sendMessage(button.dataset.question));
    });

    document.getElementById("clearChat").addEventListener("click", () => {
      chat.replaceChildren();
      addMessage("Chat cleared! What would you like to ask about gaming?", "bot");
      input.focus();
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) voiceButton.title = "Voice input is not supported in this browser";

    voiceButton.addEventListener("click", () => {
      if (!SpeechRecognition) {
        addMessage("Voice input is not supported in this browser. You can type your question instead.", "bot");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      voiceButton.setAttribute("aria-pressed", "true");
      voiceButton.setAttribute("aria-label", "Listening");
      voiceButton.title = "Listening…";
      recognition.onresult = event => sendMessage(event.results[0][0].transcript);
      recognition.onerror = () => addMessage("I couldn't hear that clearly. Please try again or type your question.", "bot");
      recognition.onend = () => {
        voiceButton.setAttribute("aria-pressed", "false");
        voiceButton.setAttribute("aria-label", "Start voice input");
        voiceButton.title = "Start voice input";
      };
      try {
        recognition.start();
      } catch {
        voiceButton.setAttribute("aria-pressed", "false");
        addMessage("Voice input couldn't start. Please try again or type your question.", "bot");
      }
    });

    loadChat();
  </script>
</body>
</html>
